# Simorgh — hyprlock (screen lock), glassy, matching the default theme.
# Colors are simple on purpose; the full theme lives in Hyprland/Waybar.
general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(45, 212, 191, 0.4)
    inner_color = rgba(13, 20, 24, 0.65)
    font_color = rgb(230, 237, 243)
    fade_on_empty = true
    placeholder_text = <i>Password</i>
    hide_input = false
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    color = rgb(230, 237, 243)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = Simorgh
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    color = rgb(230, 237, 243)
    position = 0, 40
    halign = center
    valign = center
}
