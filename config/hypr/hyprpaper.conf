# Simorgh — hyprpaper (wallpaper)
# NOTE: this file is regenerated by `simorgh-theme` on every theme switch
# with the absolute path of the active theme's wallpaper. The template
# below points at the default (teal-glass) wallpaper, which is the
# signature phoenix image (see themes/teal-glass/colors).
# NOTE: hyprpaper 0.8 uses the block form only — the old flat
# `preload =` / `wallpaper = ,path` lines are ignored. `splash` and `ipc`
# are still valid top-level options (not flat-form): keep the splash text
# off and IPC on, as the shipped config always had.
splash = false
ipc = on
wallpaper {
    monitor = ;
    # NOTE: `~` is NOT expanded in `path` (hyprpaper documents tilde
    # expansion only for `source`); $HOME is expanded by hyprlang, so
    # the template uses the same absolute path simorgh-theme writes.
    path = $HOME/.local/share/simorgh/wallpapers/simorgh-signature.png;
    fit_mode = cover;
}
