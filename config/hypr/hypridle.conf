# Simorgh — hypridle (idle management)
# Timings are in seconds and easy to change:
#   300 s  lock the screen
#   360 s  turn the screen off
#   900 s  suspend the system
# Edit the numbers below, then run: hyprctl reload
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
