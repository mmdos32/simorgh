# Simorgh — hypridle (idle management)
# Timings are in seconds and easy to change:
#   300 s  lock the screen
#   360 s  turn the screen off
#   900 s  suspend the system
# Edit the numbers below, then restart hypridle — `hyprctl reload`
# only reloads Hyprland, hypridle never re-reads this file:
#   pkill hypridle; hypridle &
# NOTE: Hyprland is Lua now (0.55+), so `hyprctl dispatch` takes a Lua
# dispatcher — the old `dpms on/off` form no longer parses.
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
