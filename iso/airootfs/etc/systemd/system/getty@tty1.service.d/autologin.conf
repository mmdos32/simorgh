# Kept deliberately as an SDDM-failure fallback, not as the live login.
# SDDM runs on tty1 (sddm.service Conflicts=getty@tty1.service), so this
# getty only ever starts if SDDM dies — then it gives a root rescue
# console on the live ISO. The live session itself autologins as liveuser
# via SDDM (see etc/sddm.conf.d/autologin.conf), never as root.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' --noclear --autologin root - $TERM
