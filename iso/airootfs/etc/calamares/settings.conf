---
modules-search: [local]
instances:
  - id: simorgh
    module: shellprocess
    config: shellprocess@simorgh.conf
  - id: keyring
    module: shellprocess
    config: shellprocess@keyring.conf
sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - bootloader
    - shellprocess@keyring
    - packages
    - shellprocess@simorgh
    - umount
  - show:
    - finished
branding: simorgh
prompt-install: true
dont-chroot: false
