---
# Populate the target keyring BEFORE the packages step installs anything.
# The packages module runs with update_db: true and verifies package
# signatures against the target keyring; without this, a target whose
# keyring unpackfs did not populate (or populated only partially) fails
# the install with unknown/invalid signatures. Idempotent: safe to run
# even when the keyring is already initialised.
dontChroot: false
timeout: 600
script:
  # Retry once via --populate alone: a transient gpg failure here used
  # to fail the Calamares step (and the whole install) before any
  # package was installed. Idempotent, like the command itself.
  - command: "pacman-key --init"
    timeout: 600
  - command: "pacman-key --populate archlinux || pacman-key --populate archlinux"
    timeout: 600
  # Remove the live image's mkinitcpio drop-in BEFORE the packages step:
  # any mkinitcpio run from here on (e.g. a kernel (re)install) must use
  # the stock config, not the archiso-only HOOKS. Idempotent.
  - command: "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    timeout: 60
