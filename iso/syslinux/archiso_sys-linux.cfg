LABEL arch
TEXT HELP
Boot the Simorgh live/install ISO on BIOS.
It boots into the Simorgh live desktop and starts the graphical installer.
ENDTEXT
MENU LABEL Simorgh live/install ISO (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Simorgh live/install ISO on BIOS with speakup screen reader.
It boots into the Simorgh live desktop with speech feedback.
ENDTEXT
MENU LABEL Simorgh live/install ISO (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
